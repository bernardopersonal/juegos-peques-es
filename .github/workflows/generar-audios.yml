name: Generar audios (ElevenLabs)

# Se lanza a mano: pestaña Actions > "Generar audios" > Run workflow.
# La clave se lee del Secret ELEVENLABS_API_KEY y nunca se guarda en el repo.
on:
  workflow_dispatch:
    inputs:
      solo_prueba:
        description: "Solo prueba: 8 frases de muestra para escuchar la voz (no se guardan en el repo)"
        type: boolean
        default: true
      regenerar_todo:
        description: "Regenerar todos los audios (gasta más créditos)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  audios:
    runs-on: ubuntu-latest
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # --- Modo prueba ---
      - name: Generar muestra de voz
        if: ${{ inputs.solo_prueba }}
        run: node scripts/generar-audios.mjs --prueba
      - name: Subir muestra para descargar
        if: ${{ inputs.solo_prueba }}
        uses: actions/upload-artifact@v4
        with:
          name: prueba-voz
          path: prueba-voz/
          retention-days: 7
      - name: Guardar muestra en la rama prueba-voz (no toca main)
        if: ${{ inputs.solo_prueba }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan prueba-voz
          git rm -rfq --cached .
          git add -f prueba-voz
          git commit -qm "Muestra de voz"
          git push -qf origin prueba-voz

      # --- Generación completa ---
      - name: Generar MP3
        if: ${{ !inputs.solo_prueba }}
        run: node scripts/generar-audios.mjs ${{ inputs.regenerar_todo && '--force' || '' }}
      - name: Guardar audios en el repo
        if: ${{ !inputs.solo_prueba }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A audio
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Audios generados con ElevenLabs"
          git push
